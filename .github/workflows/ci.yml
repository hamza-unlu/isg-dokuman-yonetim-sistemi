name: ISG App CI

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - name: Kodu Çek (Checkout)
      uses: actions/checkout@v4

    - name: Node.js Kurulumu
      uses: actions/setup-node@v4
      with:
        node-version: '20.x'

    - name: Bağımlılıkları Yükle (npm install)
      run: npm install

    - name: Testleri Çalıştır (npm test)
      run: npm test
      env:
        JWT_SECRET: test_gizli_anahtari
        PORT: 5500