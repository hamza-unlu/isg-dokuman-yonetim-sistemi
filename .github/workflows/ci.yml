name: ISG App CI

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - name: Kodu Çek (Checkout)
      uses: actions/checkout@v4
      with:
        fetch-depth: 0          # SonarCloud için tam git geçmişi gerekli

    - name: Node.js Kurulumu
      uses: actions/setup-node@v4
      with:
        node-version: '20.x'

    - name: Bağımlılıkları Yükle
      run: npm install

    - name: Testleri Çalıştır ve Coverage Üret
      run: npx jest --coverage --testPathIgnorePatterns="integration|system" --forceExit
      env:
        JWT_SECRET: test_gizli_anahtari
        PORT: 5500

    - name: SonarCloud Analizi
      uses: SonarSource/sonarcloud-github-action@master
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}